[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyindy"]


[project]
name = "pyindy"
version = "1.0.1"
authors = [
    { name="grp" },
]
description = "Common Python library for the Indy robot system (MongoDB access, parameters, LLM, TTS)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    # mongo
    "pymongo",

    # llm
    "requests",
    "openai",
    "chromadb",

    # functions
    "numpy==1.24.4",

    # grp_tts
    "simpleaudio",
    "pydub",
    "gtts",
    "scipy",
]
# プレフィックスキーの設定
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# ウインドウの移動
bind C-p previous-window
bind C-n next-window

# 画面分割の設定
bind | split-window -h
bind - split-window -v
bind C-h select-pane -L
bind h select-pane -L
bind C-j select-pane -D
bind j select-pane -D
bind C-k select-pane -U
bind k select-pane -U
bind C-l select-pane -R
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

## window-status を中央揃えで配置する
set-option -g status-justify "left"
## status line の背景色を指定する。
set-option -g status-bg "colour238"
## status line の文字色を指定する。
set-option -g status-fg "colour255"
## status-left の最大の長さを指定する。
set-option -g status-left-length 20
## status-left のフォーマットを指定する。
set-option -g status-left "#[fg=colour255,bg=colour241] [#S] #[default]"
## window-status のフォーマットを指定する。
set-window-option -g window-status-format " #I: #W "
## カレントウィンドウの window-status のフォーマットを指定する
set-window-option -g window-status-current-format "#[fg=colour255,bg=yellow,bold] #I: #W #[default]"
## status-right の最大の長さを指定する。
set-option -g status-right-length 60
## status-right のフォーマットを指定する。
set-option -g status-right "#[fg=colour255,bg=colour241] #h | %m/%d %H:%M:%S#[default]"

#ウィンドウで動作があってもステータスラインでハイライトしない
set-window-option -g monitor-activity off

# コピーモードをviキーバインドで
set-window-option -g mode-keys vi

# ウィンドウ名が自動的に更新されないように
set-window-option -g automatic-rename off

# 履歴を長くする
set-option -g history-limit 10000

# マウス操作
set-window-option -g mouse on

# 複数Paneで同期する設定
bind e setw synchronize-panes on
bind E setw synchronize-panes off


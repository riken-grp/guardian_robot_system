/**/human_tracker_integration_node:
  ros__parameters:
    right_node_name: "right_human_tracker_node"
    left_node_name: "left_human_tracker_node"

    integrate_angle: 20.0   # [deg]
    matching_range: 0.3   # [m]

    trace_range: 0.4    # [m]

    too_close_range: 0.4  # [m]
    priority_range: 2.5   # [m]
    priority_min_angle: -90.0   # [deg]
    priority_max_angle: 90.0   # [deg]
    range_weight: 2.0
    angle_weight: 1.0
    face_direction_weight: 0.5
    prority_sep_num: 5
    max_sep_id: 6

    save_db: false

    rviz_fixed_frame: 'body_link'
    rviz_view_text: "human_id"    # "name" or "human_id" or "sep_id"

    client_number: 10

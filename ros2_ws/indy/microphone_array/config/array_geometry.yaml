# 16-channel microphone array geometry (measured on a reference robot unit; RASP-ZX 16ch)
#
# Measured positions relative to $(robot_name)_body_link center.
# Stored in microphone_array_base frame (coincident with body_link: xyz=0,0,0 rpy=0,0,0).
#
# Coordinate system: x-forward, y-left, z-up (ROS convention)
# Source: sensor position measurement on that unit
#   The measured values are already in x=forward, y=left, z=up (no axis conversion).
#   2026-11-16: verified on a robot unit with hand claps at 0/+90/180/-90 deg
#   (SRP-PHAT azimuth error <= 2 deg). The previous file applied
#   ros_x=meas_z, ros_y=meas_x, ros_z=meas_y, which rotated the array.

urg_node2:
  ros__parameters:
    ip_address: '192.168.4.10'
    ip_port: 10940
    frame_id : 'laser_f_link'
    calibrate_time : false
    synchronize_time : false
    publish_intensity : false
    publish_multiecho : false
    error_limit : 4
    error_reset_period : 5.0
    diagnostics_tolerance : 0.05
    diagnostics_window_time : 5.0
    time_offset : 0.0
    angle_min : -2.2
    angle_max : 2.2
    skip : 3
    cluster : 1
    # QoS: BEST_EFFORT for WiFi stability (old scans are discarded, not queued)
    qos_overrides:
      /scan:
        publisher:
          reliability: best_effort
          durability: volatile
          history: keep_last
          depth: 1

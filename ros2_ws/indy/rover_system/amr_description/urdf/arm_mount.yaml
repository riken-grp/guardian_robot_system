# 腕の取り付け位置と、手先制御で使う干渉判定用の箱の定義
# amr.xacro（TF 表示）と arm_moveit_driver（手先制御の座標変換・胴体干渉判定）の両方が読む。
#
# 注意: 現在の値はすべて仮値（肩の辺りに取り付け、胴体は amr.xacro の body_link の箱）。
#       実測値に更新するまで、胴体基準の手先指令と干渉判定の精度は保証できない。

# 取り付けの基準フレーム（実際のフレーム名は "<ROBOT_NAME>_" + parent_link）
parent_link: body_link

# 腕モデル（guardian_urdf/arm.urdf）の base_link を parent_link から見た位置・姿勢
#   腕モデルの軸: z = 腕を真横に伸ばす方向（関節角 0,0,0,0 の姿勢）、
#                y = 初期姿勢（腕を下ろした姿勢）で手先が向く側
#   左腕は同じ部品を反転して取り付けているため、右腕を前後軸（x）まわりに 180° 回した姿勢になる
right_arm:
  xyz: [0.0, -0.15, 0.40]                     # [m] 仮値
  rpy: [-1.5707963268, 0.0, 3.1415926536]     # [rad]
left_arm:
  xyz: [0.0, 0.15, 0.40]                      # [m] 仮値
  rpy: [1.5707963268, 0.0, 3.1415926536]      # [rad]

# 手先制御の干渉判定に使う箱（parent_link 基準）。関節角指令（goal_joints）には使わない。
collision_boxes:
  body:
    size: [0.3, 0.3, 1.0]     # [m] 仮値（amr.xacro の body_link と同じ）
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]

# 箱を各辺この値だけ大きくして判定する [m]（形状と取り付けが仮値のため大きめにとる）
collision_padding: 0.03

# 取り付け部で常に箱と接する腕のリンク（これらと箱の干渉は判定しない）
collision_allowed_links: [base_link, shoulder_1_link]

asr_node:
  ros__parameters:
    model_size: 'large-v3'
    language: 'ja'
    device: 'cuda'
    compute_type: 'float16'
    # Decoding (fast settings for short utterances)
    beam_size: 1
    condition_on_previous_text: false
    without_timestamps: true
    # confidence: mean word probability if true (as kad/asr, slightly slower),
    # otherwise exp(avg_logprob)
    word_timestamps: false
    # Parallel transcriptions: at most 2-3 people speak at the same time.
    # Each worker holds its own model copy on the GPU (large-v3 fp16: ~3 GB).
    num_workers: 3
    # Speaker location in the robot base frame (default: <ROBOT_NAME>_base_link).
    # speech_frame is used only when the SpeechSegment header has no frame_id.
    # base_frame: 'base_link'
    speech_frame: 'microphone_array_base'
    # Hallucination suppression
    vad_filter: true                 # faster-whisper Silero VAD (false if onnxruntime fails)
    vad_min_silence_ms: 500
    no_speech_threshold: 0.6         # drop a segment if no_speech_prob > 0.6 and avg_logprob < -1.0
    log_prob_threshold: -1.0
    compression_ratio_threshold: 2.4 # drop repetitive segments
    min_duration: 0.3                # s; shorter segments are not transcribed
    # A result consisting only of these phrases (and repetitions) is dropped
    hallucination_phrases:
      - 'ご視聴ありがとうございました'
      - 'ご視聴ありがとうございます'
      - '最後までご視聴いただきありがとうございました'
      - '最後までご視聴ありがとうございました'
      - 'チャンネル登録よろしくお願いします'
      - 'チャンネル登録お願いします'
      - 'チャンネル登録'
      - '高評価'
      - '字幕視聴ありがとうございました'
      - 'ご清聴ありがとうございました'
      - 'ご利用いただきありがとうございます'
      - '最後まで視聴してくださって本当にありがとうございます'
      - 'また見てね'
      - '次回へ続く'
      - '次の動画でお会いしましょう'
      - '字幕作成'
      - 'by H.'
